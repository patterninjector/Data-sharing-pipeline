spring.application.name=aggregation-service
server.port=8082
#logging config
logging.level.root = debug
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
#
auth.service.url=http://localhost:8085/auth/validate
slow.controller.delay=2000
flaky.controller.rate=0.5
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.max-http-header-size=16384
server.tomcat.max-http-form-post-size=10485760





