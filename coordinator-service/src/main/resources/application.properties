######################################
# Server & Application Configuration
######################################
server.port=8080
spring.application.name=coordinator-service

######################################
# Logging Configuration
######################################
# Root logging level
# logging.level.root=DEBUG

# Enable detailed logging for Spring Web
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Enable detailed logging for Feign clients (REST client)
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.feign.codec=DEBUG

######################################
# Nonexistent Fallback URL (Mock)
######################################
service.nonexistent.url=http://nonexistent:8080

######################################
# Service URLs - Environment Variable Based
# Fall back to localhost if env var not set
######################################
service.filter.url=${FILTER_URL:http://localhost:8081}
service.aggregation.url=${AGGREGATION_URL:http://localhost:8082}
service.anonymization.url=${ANONYMIZATION_URL:http://localhost:8083}
service.formatting.url=${FORMATTING_URL:http://localhost:8084}
service.dataProduct.url=${DATA_PRODUCT_URL:http://localhost:8089}

######################################
# Pipeline Directory Configuration
######################################
# Can be overridden with command line args
pipeline.input-dir=classpath:pipelines

######################################
# File Upload Size Limits
######################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.max-http-header-size=16384
server.tomcat.max-http-form-post-size=10485760

######################################
# Circuit Breaker Configuration (Optional, Uncomment if used)
######################################
# resilience4j.circuitbreaker.instances.filter-service.failure-rate-threshold=50
# resilience4j.circuitbreaker.instances.filter-service.wait-duration-in-open-state=5000
# resilience4j.circuitbreaker.instances.filter-service.permitted-number-of-calls-in-half-open-state=3
# resilience4j.circuitbreaker.instances.filter-service.sliding-window-size=10
